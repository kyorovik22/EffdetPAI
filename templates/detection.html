<!DOCTYPE html>
<html>
  <head>
    <!-- Basic -->
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <!-- Mobile Metas -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <!-- Site Metas -->
    <link
      rel="icon"
      href="{{ url_for('static', filename='images/fevicon.png') }}"
      type="image/gif"
    />
    <title>Hostit</title>

    <!-- Bootstrap core CSS -->
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/bootstrap.css') }}"
    />
    <!-- Fonts style -->
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap"
      rel="stylesheet"
    />
    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/font-awesome.min.css') }}"
    />
    <!-- Custom styles -->
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/responsive.css') }}"
    />
  </head>

  <style>
    .service_section {
      padding: 50px 0;
      text-align: center;
    }

    .upload-container {
      width: 50%;
      margin: auto;
      padding: 20px;
      border: 2px dashed #007bff;
      border-radius: 10px;
      text-align: center;
      background-color: #f9f9f9;
    }

    .upload-container input {
      display: none;
    }

    .upload-container label {
      display: block;
      padding: 15px;
      background: #007bff;
      color: #fff;
      cursor: pointer;
      border-radius: 5px;
    }

    .upload-container label:hover {
      background: #0056b3;
    }

    .preview {
      margin-top: 20px;
    }

    #preview-img {
      max-width: 100%;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
    }

    .btn-detect {
      margin-top: 20px;
      padding: 10px 20px;
      background: #28a745;
      color: #fff;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    .btn-detect:hover {
      background: #218838;
    }

    .alert-success {
      margin-top: 20px;
      color: #155724;
      background-color: #d4edda;
      border: 1px solid #c3e6cb;
      border-radius: 5px;
      padding: 10px;
    }
  </style>

  <body class="sub_page">
    <div class="hero_area">
      <!-- header section strats -->
      <header class="header_section">
        <div class="container-fluid">
          <nav class="navbar navbar-expand-lg custom_nav-container">
            <a class="navbar-brand" href="{{ url_for('home') }}">
              <span>Mon's</span>
            </a>
            <button
              class="navbar-toggler"
              type="button"
              data-toggle="collapse"
              data-target="#navbarSupportedContent"
              aria-controls="navbarSupportedContent"
              aria-expanded="false"
              aria-label="Toggle navigation"
            >
              <span class=""> </span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
              <ul class="navbar-nav ml-auto">
                <li class="nav-item">
                  <a class="nav-link" href="{{ url_for('home') }}">
                    Home <span class="sr-only">(current)</span>
                  </a>
                </li>
                <li class="nav-item active">
                  <a class="nav-link" href="{{ url_for('about') }}">About</a>
                </li>
                <li class="nav-item">
                  <a class="nav-link" href="{{ url_for('detection') }}"
                    >Detection</a
                  >
                </li>
              </ul>
            </div>
          </nav>
        </div>
      </header>
      <!-- end header section -->
    </div>

    <section class="service_section">
      <div class="container">
        <div class="heading_container heading_center">
          <h2>Upload Gambar untuk Deteksi</h2>
        </div>
      </div>

      <div class="container">
        <div class="upload-container">
          <form
            id="upload-form"
            method="POST"
            action="/upload"
            enctype="multipart/form-data"
          >
            <input
              type="file"
              id="file-input"
              name="file"
              accept="image/*"
              onchange="previewImage(event)"
              required
            />
            <label for="file-input">Pilih Gambar</label>
            <div class="preview">
              <img
                id="preview-img"
                src="#"
                alt="Preview"
                style="display: none"
              />
            </div>
            <button type="submit" class="btn-detect">Mulai Deteksi</button>
          </form>

          <!-- Tampilkan pesan dari Flask -->
          {% with messages = get_flashed_messages() %} {% if messages %}
          <div class="alert alert-success mt-3">
            {% for message in messages %}
            <p>{{ message }}</p>
            {% endfor %}
          </div>
          {% endif %} {% endwith %}
        </div>
      </div>
    </section>

    <!-- jQuery -->
    <script src="{{ url_for('static', filename='js/jquery-3.4.1.min.js') }}"></script>
    <!-- Bootstrap JS -->
    <script src="{{ url_for('static', filename='js/bootstrap.js') }}"></script>
    <!-- Custom JS -->
    <script src="{{ url_for('static', filename='js/custom.js') }}"></script>

    <script>
      function previewImage(event) {
        const input = event.target;
        const reader = new FileReader();
        reader.onload = function () {
          const imgElement = document.getElementById("preview-img");
          imgElement.src = reader.result;
          imgElement.style.display = "block";
        };
        reader.readAsDataURL(input.files[0]);
      }
    </script>
  </body>
</html>
